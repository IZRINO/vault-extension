[workspace]
resolver = "2"
members = [
    "crates/vault-core",
    "crates/vault-importers",
]

[workspace.dependencies]
wasm-bindgen = "0.2"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Speed up cryptographic & compression primitives during `cargo test` without weakening parameters
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
