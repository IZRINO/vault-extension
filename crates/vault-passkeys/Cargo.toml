[package]
name = "vault-passkeys"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["authenticator"]
authenticator = ["dep:ciborium"]

[dependencies]
vault-core = { path = "../vault-core" }
base64 = "0.22"
ciborium = { version = "0.2.2", optional = true }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "zeroize"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
psl = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2.5"
wasm-bindgen.workspace = true
zeroize.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--converge", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-multivalue"]
