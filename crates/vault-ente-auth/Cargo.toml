[package]
name = "vault-ente-auth"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
zeroize.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-otp = { path = "../vault-otp" }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
crypto_secretstream = { path = "vendor/crypto_secretstream", default-features = false, features = ["alloc"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--converge", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-multivalue"]
