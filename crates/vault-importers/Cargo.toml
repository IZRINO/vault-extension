[package]
name = "vault-importers"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
zeroize.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vault-otp = { path = "../vault-otp" }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
pbkdf2 = "0.12"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--converge", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-multivalue"]
