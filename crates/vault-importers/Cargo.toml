[package]
name = "vault-importers"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
zeroize.workspace = true
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8", "zeroize"] }
vault-otp = { path = "../vault-otp" }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
pbkdf2 = "0.12"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
aes-kw = "0.2"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2.5"
hex = "0.4"
keepass = "0.17"
quick-xml = { version = "0.42", features = ["serialize"] }
prost = "0.14"
scrypt = { version = "0.11", default-features = false }
zip = { version = "4.6", default-features = false, features = ["deflate", "aes-crypto"] }
vault-core = { path = "../vault-core" }
vault-passkeys = { path = "../vault-passkeys", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--converge", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-sign-ext", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-reference-types", "--enable-multivalue"]
